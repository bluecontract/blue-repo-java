buildscript {
    dependencies {
        classpath 'org.apache.groovy:groovy-toml:4.0.22'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.24.0'
}

group = 'blue.repo'
version = findProperty('releaseVersion') ?: determineProjectVersion()

ext.blueLanguageVersion = '3.1.0-rc.24'
ext.blueLocalRcMode = providers.gradleProperty('blueDependencyMode').orNull == 'immutable-local-rc-artifacts'
ext.blueDevelopmentMode = blueLocalRcMode || providers.gradleProperty('blueDependencyMode').orNull == 'immutable-development-artifacts'
if (blueDevelopmentMode) apply from: 'gradle/development-bindings.gradle'

base {
    archivesName = 'blue-repo-java'
}

repositories {
    if (blueDevelopmentMode) {
        exclusiveContent {
            forRepository { maven { url = uri(blueLanguageDevelopmentBinding.repository) } }
            filter { includeGroup('blue.language') }
        }
    }
    if (!blueDevelopmentMode && !System.getenv('CI')) {
        mavenLocal()
    }
    mavenCentral()
}

configurations {
    blueLanguageRegistry {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    blueContractsRegistry {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    api "blue.language:blue-language-java:${blueLanguageVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'

    blueLanguageRegistry "blue.language:blue-language-core:${blueLanguageVersion}"
    blueContractsRegistry "blue.language:blue-contracts-core:${blueLanguageVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileTestJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    useJUnitPlatform()
    reports {
        junitXml.required = true
        html.required = true
    }
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

ext.genResourcesDir = file("$buildDir/generated-resources")
task generateBuildProperties {
    ext.buildPropertiesFile = file("$genResourcesDir/blue/repo/build.properties")
    inputs.property('projectVersion', project.version.toString())
    outputs.file(buildPropertiesFile)
    doLast {
        buildPropertiesFile.text = """\
                |blue-repo-java.build.version=$project.version
        """.stripMargin().trim()
    }
}
sourceSets.main.output.dir genResourcesDir, builtBy: generateBuildProperties

def generatedRepositorySourcePaths = [
        'src/main/java/blue/repo/BlueRepositoryModels.java',
        'src/main/java/blue/repo/bootstrap',
        'src/main/java/blue/repo/common',
        'src/main/java/blue/repo/coordination',
        'src/main/java/blue/repo/finoscdm60d07',
        'src/main/java/blue/repo/mandate',
        'src/main/java/blue/repo/myos',
        'src/main/java/blue/repo/paynote',
        'src/main/java/blue/repo/sessioninteraction',
        'src/main/java/blue/repo/types',
        'src/main/java/blue/repo/workflows',
        'src/main/resources/blue/repo'
]

def registryInputsRoot = layout.buildDirectory.dir('registry-inputs')

tasks.register('extractRegistryInputs', Sync) {
    group = 'blue repository'
    description = 'Extracts the exact Language 1.0 and Contracts 1.0 registry inputs used by source generation.'
    into registryInputsRoot
    from({ configurations.blueLanguageRegistry.collect { zipTree(it) } }) {
        include 'registry/blue-language-1.0/**'
    }
    from({ configurations.blueContractsRegistry.collect { zipTree(it) } }) {
        include 'registry/blue-contracts-1.0/**'
    }
}

tasks.named('test') {
    dependsOn tasks.named('extractRegistryInputs')
}

def snapshotGeneratedRepositoryFiles = {
    def snapshot = new TreeMap<String, String>()
    generatedRepositorySourcePaths.each { relativePath ->
        def root = file(relativePath)
        if (root.isFile()) {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            digest.update(root.bytes)
            snapshot[relativePath] = digest.digest().encodeHex().toString()
        } else if (root.exists()) {
            fileTree(root).visit { details ->
                if (!details.directory) {
                    def digest = java.security.MessageDigest.getInstance('SHA-256')
                    digest.update(details.file.bytes)
                    snapshot["${relativePath}/${details.relativePath.pathString}"] = digest.digest().encodeHex().toString()
                }
            }
        }
    }
    return snapshot
}

def nodeExecutable = {
    def explicit = System.getenv('NODE_BINARY') ?: System.getenv('NODE')
    if (explicit) {
        return explicit
    }

    def candidates = [
            '/opt/homebrew/bin/node',
            '/usr/local/bin/node',
            '/usr/bin/node'
    ]

    def nvmVersions = file("${System.getProperty('user.home')}/.nvm/versions/node")
    if (nvmVersions.exists()) {
        def nvmNodes = nvmVersions.listFiles()
                ?.findAll { it.directory }
                ?.sort { a, b -> b.name <=> a.name }
                ?.collect { new File(it, 'bin/node').absolutePath } ?: []
        candidates.addAll(0, nvmNodes)
    }

    def found = candidates.find { file(it).canExecute() }
    return found ?: 'node'
}

def repositoryGeneratorArgs = {
    def args = ['tools/generate-repository-sources.js']
    def explicitSource = project.findProperty('blueRepositoryBlue') ?:
            project.findProperty('blueRepositorySource') ?:
            System.getenv('BLUE_REPOSITORY_BLUE') ?:
            System.getenv('BLUE_REPOSITORY_SOURCE')
    if (explicitSource) {
        args.add('--repository')
        args.add(explicitSource.toString())
    }
    def explicitProviderBundle = project.findProperty('blueRepositoryProviderBundle') ?:
            System.getenv('BLUE_REPOSITORY_PROVIDER_BUNDLE')
    if (explicitProviderBundle) {
        args.add('--provider-bundle')
        args.add(explicitProviderBundle.toString())
    }
    args.add('--language-registry')
    args.add(registryInputsRoot.get().file('registry/blue-language-1.0').asFile.absolutePath)
    args.add('--contracts-registry')
    args.add(registryInputsRoot.get().file('registry/blue-contracts-1.0').asFile.absolutePath)
    return args
}

tasks.register('generateRepositorySources', Exec) {
    group = 'blue repository'
    description = 'Generates stable-package Java sources, constants, resources, and manifest from BlueRepository.blue.'
    dependsOn tasks.named('extractRegistryInputs')
    commandLine([nodeExecutable()] + repositoryGeneratorArgs())
}

tasks.register('verifyGeneratedSources') {
    group = 'verification'
    description = 'Regenerates repository sources and fails if checked-in generated output is stale.'
    dependsOn tasks.named('extractRegistryInputs')
    outputs.upToDateWhen { false }

    doLast {
        def before = snapshotGeneratedRepositoryFiles()
        def command = [nodeExecutable()] + repositoryGeneratorArgs()
        def process = new ProcessBuilder(command)
                .directory(projectDir)
                .inheritIO()
                .start()
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("Repository source generation failed with exit code ${exitCode}.")
        }
        def after = snapshotGeneratedRepositoryFiles()
        if (before != after) {
            def changed = new TreeSet<String>()
            changed.addAll(before.keySet())
            changed.addAll(after.keySet())
            changed = changed.findAll { before[it] != after[it] } as TreeSet<String>
            def shown = changed.take(20).collect { " - ${it}" }.join('\n')
            def suffix = changed.size() > 20 ? "\n - ... ${changed.size() - 20} more" : ''
            throw new GradleException("Generated repository sources are stale. Run ./gradlew generateRepositorySources and commit the result.\n${shown}${suffix}")
        }
    }
}

check.dependsOn tasks.named('verifyGeneratedSources')

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'blue.repo'
            artifactId = 'blue-repo-java'
            from components.java

            pom {
                name = 'Blue Repository Java Companion'
                description = 'Classpath packaged Blue repository definitions and Java accessors.'
                url = 'https://repo.blue'
                licenses {
                    license {
                        name = 'MIT license'
                        url = 'https://github.com/bluecontract/blue-repository'
                    }
                }
                developers {
                    developer {
                        name = 'Blue'
                        email = 'devsupport@timeline.blue'
                    }
                }
                scm {
                    url = 'https://github.com/bluecontract/blue-repo-java.git'
                    connection = 'scm:git:git@github.com:bluecontract/blue-repo-java.git'
                    developerConnection = 'scm:git:git@github.com:bluecontract/blue-repo-java.git'
                }
            }
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
        if (!System.getenv('CI')) {
            maven {
                name = 'local'
                url = uri('file:///' + new File(System.getProperty("user.home"), ".m2/repository").absolutePath)
            }
        }
    }
}

if (System.getenv('CI')) {
    jreleaser {
        signing {
            active = 'ALWAYS'
            armored = true
        }
        project {
            description = 'Classpath packaged Blue repository definitions and Java accessors.'
            copyright = 'Copyright 2026 Blue Company. Licensed under the MIT License'
        }

        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'ALWAYS'
                        url = 'https://central.sonatype.com/api/v1/publisher'
                        applyMavenCentralRules = true
                        snapshotSupported = true
                        stagingRepository('build/staging-deploy')
                    }
                }
            }
        }
    }
}

def determineProjectVersion() {
    def tomlFile = file('.cz.toml')
    if (tomlFile.exists()) {
        def toml = new groovy.toml.TomlSlurper().parse(tomlFile)
        return toml.tool.commitizen.version + (!System.getenv('CI') ? '-SNAPSHOT' : '')
    } else {
        throw new GradleException(".cz.toml file not found")
    }
}

apply from: 'gradle/development-export.gradle'
