name: Release

on:
  workflow_dispatch:

jobs:
  Release:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Check if branch is main
        run: |
          if [[ "${GITHUB_REF##*/}" != "main" ]]; then
            echo "This workflow can only be triggered for the main branch."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install generator dependencies
        run: npm ci

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Execute Gradle build
        run: ./gradlew clean build

      - name: Execute Gradle publish
        run: ./gradlew publish

      - name: Configure Maven Central credentials
        env:
          MAVENCENTRAL_TOKEN_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: |
          token="$(printf '%s:%s' "$MAVENCENTRAL_TOKEN_USERNAME" "$MAVENCENTRAL_TOKEN_PASSWORD" | base64 | tr -d '\n')"
          echo "JRELEASER_MAVENCENTRAL_USERNAME=$MAVENCENTRAL_TOKEN_USERNAME" >> "$GITHUB_ENV"
          echo "JRELEASER_MAVENCENTRAL_PASSWORD=$token" >> "$GITHUB_ENV"

      - name: Execute Gradle release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: ./gradlew jreleaserFullRelease --stacktrace

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            build/libs
            build/publications
            build/jreleaser
